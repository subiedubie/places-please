<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Places, Please</title>
  <!-- Fill the phone screen, no pinch-zoom, draw under the notch. -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <!-- These let the game be added to the Home Screen and open like an app. -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Places, Please">
  <meta name="theme-color" content="#ffffff">
  <link rel="stylesheet" href="ui/style.css">
  <link rel="stylesheet" href="ui/events.css">
  <link rel="stylesheet" href="ui/help.css">
  <link rel="stylesheet" href="ui/shop.css">
</head>
<body>
<div id="app">

  <!-- HOME -->
  <section id="screen-home" class="screen" hidden>
    <!-- Home is three columns: side-game badges down the left edge, the level
         and Play button in the middle, more badges down the right edge.
         The two badge columns are filled by ui/events.js. -->
    <div id="home-body" class="home-body">
    <div id="home-left" class="home-side left"></div>
    <div class="home-mid">
      <!-- The title. Right after a level, the round banner sits here instead
           (same box, so nothing below it moves). -->
      <header class="home-top">
        <h1 id="home-title" class="title">Places, Please</h1>
        <div id="home-round" class="home-round" hidden>
          <div class="home-round-text">
            <div id="home-round-title" class="home-round-title"></div>
            <div id="home-round-coins" class="home-round-coins"></div>
          </div>
          <!-- Opens the full list of what the level paid (the old Results screen). -->
          <button id="home-round-details" class="home-round-details" type="button">details</button>
        </div>
      </header>
      <div class="card">
        <div id="home-tier" class="label"></div>
        <div id="home-level" class="big"></div>
      </div>
      <div class="card coins-card"><div><div class="label">Coins</div><div id="home-coins" class="mid"></div></div><button id="home-shop" class="home-shop" type="button">Shop</button></div>
      <!-- The streak gift: what the next level starts with. Hidden when there is none. -->
      <div id="home-gift" class="card gift" hidden>
        <div id="home-gift-label" class="label">Standing Ovation: starts with</div>
        <div id="home-gift-icons" class="gift-icons"></div>
        <div id="home-gift-super" class="gift-super" hidden>Super Magic Ball active</div>
      </div>
      <!-- Pre-level boosters to switch on for the next level (filled by ui/boosters.js). -->
      <div id="home-boosters" class="card gift" hidden></div>
      <button id="home-play" class="btn primary tall">Play</button>
      <!-- Timed boosts that are running (filled by ui/events.js). The side-game
           badges themselves are in #home-left and #home-right. -->
      <div id="home-events"></div>
      <p id="home-reminder" class="note" hidden></p>
    </div>
    <div id="home-right" class="home-side right"></div>
    </div>
    <footer class="home-bottom">
      <button id="home-settings" class="btn quiet">Settings</button>
      <!-- Opens the full rules sheet (ui/help.js). -->
      <button id="home-help" class="btn quiet">How to play</button>
    </footer>
  </section>

  <!-- LEVEL -->
  <section id="screen-level" class="screen" hidden>
    <header class="hud">
      <div class="hud-row">
        <div>
          <div id="hud-tier" class="label"></div>
          <div id="hud-level" class="mid"></div>
        </div>
        <!-- "?": the rules for the obstacles on this board (ui/help.js). -->
        <button id="level-help" class="btn quiet help-q" aria-label="Rules for this board">?</button>
        <div class="moves">
          <div class="label">Moves</div>
          <div id="hud-moves" class="big"></div>
        </div>
      </div>
      <div id="hud-targets" class="targets" aria-label="Targets"></div>
      <!-- A timed boost that is running, with its time left (filled by ui/events.js). -->
      <div id="level-boost" hidden></div>
    </header>
    <div id="board-box" class="board-box">
      <canvas id="board"></canvas>
    </div>
    <!-- One line of help for the booster bar (filled by ui/boosters.js). -->
    <p id="booster-hint" class="note booster-hint" role="status"></p>
    <footer class="level-bottom">
      <button id="level-quit" class="btn quiet">Quit</button>
      <!-- The four in-level boosters (filled by ui/boosters.js). -->
      <div id="booster-bar" class="booster-bar"></div>
    </footer>
  </section>

  <!-- RESULTS (no longer shown on its own: a level now ends on Home, and the
       same lines open in a sheet from the banner's "details" link) -->
  <section id="screen-results" class="screen" hidden>
    <div class="results-mid">
      <div id="results-sub" class="label"></div>
      <h2 id="results-title" class="title"></h2>
      <div id="results-lines" class="card lines"></div>
      <!-- What the level added to each side game, and new rewards (filled by ui/events.js). -->
      <div id="results-events" hidden></div>
    </div>
    <footer class="stack">
      <button id="results-next" class="btn primary tall"></button>
      <button id="results-home" class="btn quiet">Home</button>
    </footer>
  </section>

  <!-- SETTINGS -->
  <section id="screen-settings" class="screen" hidden>
    <header class="settings-top">
      <button id="settings-back" class="btn quiet">Back</button>
      <h2 class="title small">Settings</h2>
      <!-- Opens the full rules sheet (ui/help.js). -->
      <button id="settings-help" class="btn quiet">How to play</button>
    </header>
    <div class="settings-mid">
      <!-- Rival toughness: Relaxed / Even / Tough (filled by ui/events.js). -->
      <div id="settings-rivals" class="card"></div>
      <div class="card">
        <div class="label">Animation speed</div>
        <div class="segmented">
          <button id="speed-normal" class="btn seg">Normal</button>
          <button id="speed-fast" class="btn seg">Fast</button>
        </div>
      </div>
      <div class="card">
        <div class="label">Your save</div>
        <p id="settings-export-note" class="note"></p>
        <div class="stack">
          <button id="settings-export" class="btn">Export save</button>
          <button id="settings-import" class="btn">Import save</button>
        </div>
        <input id="settings-file" type="file" accept=".json,application/json,text/plain" hidden>
      </div>
      <div id="settings-recovered" class="card warn" hidden>
        <div class="label">Old save could not be read</div>
        <p class="note">The game started fresh, but the old data was kept. Download it so it is not lost.</p>
        <button id="settings-recovered-btn" class="btn">Download old data</button>
      </div>
      <p id="settings-msg" class="note" role="status"></p>
    </div>
  </section>

  <!-- Out of moves: buy more or give up (ui/boosters.js). -->
  <div id="out-of-moves" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <p><strong>Out of moves</strong></p>
      <p id="oom-note" class="note"></p>
      <div class="stack">
        <button id="oom-buy" class="btn primary tall"></button>
        <button id="oom-quit" class="btn quiet">Give up</button>
      </div>
    </div>
  </div>

  <!-- A yes/no question shown over the current screen. -->
  <div id="confirm" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true">
      <p id="confirm-text"></p>
      <div class="pair">
        <button id="confirm-no" class="btn"></button>
        <button id="confirm-yes" class="btn danger"></button>
      </div>
    </div>
  </div>

</div>
<script type="module" src="ui/main.js"></script>
</body>
</html>
